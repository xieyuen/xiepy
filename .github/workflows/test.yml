name: Test with Active Python Versions

on: workflow_call


jobs:
  test-on-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
    name: Test with python ${{ matrix.python-version }} (Ubuntu)

    steps: &steps
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install uv
          uv sync --all-extras --no-extra ci

      - name: Run Tests
        run: uv run pytest tests/

  test-on-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
    name: Test with python ${{ matrix.python-version }} (Windows)

    steps: *steps
